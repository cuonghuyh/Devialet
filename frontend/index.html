<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEVIALET - Premium Audio Excellence</title>
    
    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    
    <!-- Preload hero image -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1545454675-3531b543be5d?w=800&h=800&fit=crop" />
    
    <!-- DNS prefetch for API -->
    <link rel="dns-prefetch" href="http://localhost:8000" />
    
    <!-- Critical CSS for initial load -->
    <style>
      body { margin: 0; background: #0a0a0a; }
      #root { min-height: 100vh; }
      .page-loader { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
      .loader-spinner { width: 50px; height: 50px; border: 3px solid rgba(212,165,116,0.1); border-top-color: #D4A574; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
