services:
  app:
    build: ./backend
    container_name: devialet_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - ./backend/vendor:/var/www/vendor
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_DATABASE: devialet
      DB_USERNAME: root
      DB_PASSWORD: secret
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: devialet_frontend
    ports:
      - "5173:80"
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: devialet_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: devialet
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: devialet_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_USER: root
      PMA_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - db

volumes:
  dbdata:
